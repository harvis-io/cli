name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # Publishing to npm and PyPI is handled by publish.yml. A release created
  # with GITHUB_TOKEN does not fire other workflows' "release" event, so the
  # last step dispatches publish.yml explicitly.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
      - name: Syntax check
        run: node --check node/bin/harvis.js
      - name: Bump versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(cd node && npm version ${{ inputs.version }} --no-git-tag-version | tr -d v)
          (cd python && uv version "$VERSION")
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Push commit and tag
        run: git push origin main "v$VERSION"
      - name: Create GitHub release
        run: gh release create "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish packages
        run: gh workflow run publish.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
