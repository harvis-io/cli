name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@v5
      - name: Syntax check
        run: node --check node/bin/harvis.js
      - name: Bump versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(cd node && npm version ${{ inputs.version }} --no-git-tag-version | tr -d v)
          (cd python && uv version "$VERSION")
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Push commit and tag
        run: git push origin main "v$VERSION"
      - name: Create GitHub release
        run: gh release create "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        working-directory: node
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to PyPI
        working-directory: python
        run: |
          uv build
          uv publish
