name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Publishing is via trusted publishing (OIDC): npm mints a short-lived
      # credential from this workflow's identity, so no token has to live in
      # repository secrets. Needs npm 11.5.1+, newer than the one bundled with
      # Node 22. Both `harvis` and `hosting` must name this repo and workflow
      # file as their trusted publisher on npmjs.com. NPM_TOKEN below is only a
      # fallback for a package not yet configured — drop it once both are.
      # --provenance stays explicit: OIDC generates it on its own, the token
      # fallback does not.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Syntax check
        run: node --check bin/harvis.js
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "harvis@$VERSION" version >/dev/null 2>&1; then
            echo "harvis@$VERSION already on npm, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Same code, second name: `hosting` is the discoverable alias of `harvis`.
      - name: Publish alias
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "hosting@$VERSION" version >/dev/null 2>&1; then
            echo "hosting@$VERSION already on npm, skipping"
          else
            node scripts/alias-package.js hosting
            npm publish --provenance --access public
            git checkout package.json
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build
      # --check-url skips files already on PyPI instead of failing the job, so
      # this workflow can be re-run when only the npm half of a release failed.
      - name: Publish
        run: uv publish --check-url https://pypi.org/simple/
