name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check bin/harvis.js
      - name: Smoke test --help
        run: node bin/harvis.js --help
      - name: Smoke test --version
        run: node bin/harvis.js --version
      - name: Pack
        run: npm pack --dry-run
      - name: Pack the hosting alias
        run: |
          node scripts/alias-package.js hosting
          node -e "const p=require('./package.json'); if (p.name !== 'hosting' || !p.bin.hosting) process.exit(1)"
          npm pack --dry-run
          git checkout package.json

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync
      - name: Smoke test --help
        run: uv run harvis --help
      - name: Smoke test --version
        run: uv run harvis --version
      - name: Build
        run: uv build
